<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="168" viewBox="0 0 1200 168"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Wukong Code development path</title>
  <desc id="wf-desc">Design, plan, RED, GREEN, then verify.</desc>
  <rect width="1200" height="168" rx="24" fill="#14110C"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" text-anchor="middle">
    <g transform="translate(36 40)">
      <rect width="184" height="88" rx="12" fill="#1B160F" stroke="#C9A227" stroke-width="1.5"/>
      <text x="92" y="52" fill="#F4E8D0">DESIGN</text>
    </g>
    <g transform="translate(272 40)">
      <rect width="184" height="88" rx="12" fill="#1B160F" stroke="#C9A227" stroke-width="1.5"/>
      <text x="92" y="52" fill="#F4E8D0">PLAN</text>
    </g>
    <g transform="translate(508 40)">
      <rect width="184" height="88" rx="12" fill="#1B160F" stroke="#E24A2B" stroke-width="1.5"/>
      <text x="92" y="52" fill="#F4E8D0">RED</text>
    </g>
    <g transform="translate(744 40)">
      <rect width="184" height="88" rx="12" fill="#1B160F" stroke="#C9A227" stroke-width="1.5"/>
      <text x="92" y="52" fill="#F4E8D0">GREEN</text>
    </g>
    <g transform="translate(980 40)">
