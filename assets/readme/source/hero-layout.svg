<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Wukong Code</title>
  <desc id="desc">A complete software development methodology for coding agents. Design first, test-driven development, evidence before claims.</desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B160F"/>
      <stop offset="1" stop-color="#0E0C09"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#ground)"/>
  <rect x="20" y="20" width="6" height="340" rx="3" fill="#C9A227"/>

  <g id="title-block" transform="translate(56 48)">
    <text x="0" y="22" fill="#C9A227" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">AGENT METHODOLOGY</text>
    <text x="0" y="92" fill="#F4E8D0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="64" font-weight="700">Wukong Code</text>
    <text x="0" y="138" fill="#8A7A62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22">Skills that activate at the right moment.</text>

    <g id="process-chips" transform="translate(0 176)">
      <rect width="118" height="40" rx="8" fill="#241E16" stroke="#C9A227" stroke-width="1.5"/>
      <text x="59" y="26" text-anchor="middle" fill="#F4E8D0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">DESIGN</text>
      <rect x="134" width="90" height="40" rx="8" fill="#241E16" stroke="#C9A227" stroke-width="1.5"/>
      <text x="179" y="26" text-anchor="middle" fill="#F4E8D0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">TDD</text>
      <rect x="240" width="132" height="40" rx="8" fill="#241E16" stroke="#E24A2B" stroke-width="1.5"/>
      <text x="306" y="26" text-anchor="middle" fill="#F4E8D0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">EVIDENCE</text>
    </g>

    <text x="0" y="264" fill="#8A7A62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">v6.3.0  /  MIT  /  10 harnesses</text>
  </g>

  <g id="hoop-motif" transform="translate(620 86)" fill="none" stroke="#C9A227" stroke-width="3">
    <circle cx="36" cy="36" r="34"/>
    <circle cx="36" cy="36" r="18"/>
  </g>

  <g id="subject-area">
    <rect x="760" y="24" width="400" height="332" rx="20" fill="#14110C" opacity="0.35"/>
  </g>
</svg>
