plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.register('verifyHarness', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'example.langguidance.BatchProcessorHarness'
}

tasks.named('test') {
    enabled = false
}

tasks.named('check') {
    dependsOn(tasks.named('verifyHarness'))
}
